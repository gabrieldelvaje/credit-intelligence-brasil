name: Validate site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "scripts/**"
      - "data/dimensions/**"
      - ".github/workflows/validate-site.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check chat-ui-v5.js
          node --check chat-staged-sections.js
          node --check follow-up-entrance.js
          node --check submit-arrowhead-alignment.js
          node --check question-builder-credit.js
          node --check question-builder-slide.js

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/update_data.py
          python -m py_compile scripts/update_dimensions.py

      - name: Check required site files
        run: |
          test -f index.html
          test -f data/catalog.json
          test -f data/credit_intelligence.json
          test -f data/forecasts.json
          test -f data/dimensions/state_credit.json
          test -f data/dimensions/gender_state.json
          test -f data/dimensions/catalog.json
          test -f data/dimensions/metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path("data/catalog.json").read_text())
          forecasts=json.loads(Path("data/forecasts.json").read_text())
          rows=json.loads(Path("data/credit_intelligence.json").read_text())
          state_rows=json.loads(Path("data/dimensions/state_credit.json").read_text())
          sex_rows=json.loads(Path("data/dimensions/gender_state.json").read_text())
          dim_catalog=json.loads(Path("data/dimensions/catalog.json").read_text())
          assert len(catalog) >= 19, len(catalog)
          assert len(rows) > 9000, len(rows)
          assert len(forecasts) >= 6, len(forecasts)
          assert len(state_rows) > 5000, len(state_rows)
          assert len(sex_rows) > 8000, len(sex_rows)
          assert any(x["key"]=="delinquency_pf" and "state" in x["dimensions"] for x in dim_catalog)
          assert any(x["key"]=="unemployment" and "gender" in x["dimensions"] for x in dim_catalog)
          assert any(r["uf"]=="BR" and r["gender"]=="women" for r in sex_rows)
          latest_state=max(r["date"] for r in state_rows)
          latest_ufs={r["uf"] for r in state_rows if r["date"]==latest_state and r["key"]=="delinquency_pf"}
          assert len(latest_ufs)==27, (latest_state,len(latest_ufs))
          latest_sex=max(r["date"] for r in sex_rows)
          br_sexes={r["gender"] for r in sex_rows if r["date"]==latest_sex and r["uf"]=="BR" and r["key"]=="unemployment"}
          assert br_sexes=={"total","men","women"}, (latest_sex,br_sexes)
          expected_state_keys={"delinquency_pf","delinquency_pj","delinquency_card","delinquency_revolving","delinquency_personal","delinquency_vehicle","credit_balance_pf","credit_balance_pj","problem_assets_pf","problem_assets_pj"}
          assert expected_state_keys.issubset({r["key"] for r in state_rows})
          print(f"OK: {len(catalog)} indicadores nacionais, {len(state_rows)} linhas estaduais, {len(sex_rows)} linhas por sexo")
          PY
