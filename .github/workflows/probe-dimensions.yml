name: Probe dimensions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-dimensions.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe BCB Olinda and IBGE SIDRA APIs
        shell: python
        run: |
          import json, urllib.request, urllib.error

          urls=[
            "https://olinda.bcb.gov.br/olinda/servico/scr_sub_regiao/versao/v1/odata/",
            "https://olinda.bcb.gov.br/olinda/servico/scr_sub_regiao/versao/v1/odata/$metadata",
            "https://apisidra.ibge.gov.br/values/t/4093/n1/all/v/all/p/last%201",
            "https://apisidra.ibge.gov.br/values/t/6396/n1/all/v/all/p/last%201",
            "https://apisidra.ibge.gov.br/values/t/5436/n1/all/v/all/p/last%201",
          ]
          for url in urls:
              print("\n====",url,"====")
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Credit-Intelligence-Brasil","Accept":"application/json, application/xml;q=0.9, */*;q=0.8"})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      raw=r.read().decode("utf-8","replace")
                  print(raw[:18000])
              except Exception as e:
                  print("ERROR",repr(e))
