name: Probe dimensions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-dimensions.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest SCR.data ZIP
        shell: python
        run: |
          import io, zipfile, urllib.request

          url="https://www.bcb.gov.br/pda/desig/scrdata_2026.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Credit-Intelligence-Brasil"})
          with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read()
          print("bytes",len(raw))
          z=zipfile.ZipFile(io.BytesIO(raw))
          print("FILES")
          for n in z.namelist():
              info=z.getinfo(n)
              print(n, info.file_size)
          for n in z.namelist()[:4]:
              print("\nHEAD",n)
              with z.open(n) as fh:
                  print(fh.read(12000).decode("utf-8-sig","replace"))
