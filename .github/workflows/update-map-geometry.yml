name: Update map geometry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_map_geometry.py"
      - ".github/workflows/update-map-geometry.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official IBGE state geometry
        run: python scripts/update_map_geometry.py

      - name: Commit geometry
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/dimensions/br_states.geojson)" ]; then
            echo "Nenhuma mudança na malha."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dimensions/br_states.geojson
          git commit -m "data: refresh Brazil state geometry"
          git pull --rebase origin main
          git push
